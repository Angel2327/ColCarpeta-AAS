<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Consola{% endblock %} — ColCarpeta admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ estatico('estilos.css') }}">
  <script src="{{ estatico('confirmar.js') }}" defer></script>
</head>
<body>
  <div class="admin-franja">Consola de administración de ColCarpeta — solo lectura</div>

  <header class="encabezado">
    <div class="contenedor encabezado__barra">
      <a class="encabezado__marca" href="/admin/">ColCarpeta admin</a>
      <div class="encabezado__derecha">
        {% if mostrar_nav %}
        <nav class="encabezado__nav" aria-label="Navegación de la consola">
          <a href="/admin/"{% if request.url.path == '/admin/' %} aria-current="page"{% endif %}>Resumen</a>
          <a href="/admin/ciudadanos"{% if request.url.path.startswith('/admin/ciudadanos') %} aria-current="page"{% endif %}>Ciudadanos</a>
          <a href="/admin/transferencias"{% if request.url.path.startswith('/admin/transferencias') %} aria-current="page"{% endif %}>Transferencias</a>
          <a href="/admin/bandeja-salida"{% if request.url.path.startswith('/admin/bandeja-salida') %} aria-current="page"{% endif %}>Bandeja de salida</a>
          <a href="/admin/auditoria"{% if request.url.path.startswith('/admin/auditoria') %} aria-current="page"{% endif %}>Auditoría</a>
          <form method="post" action="/admin/salir" data-confirmar="¿Cerrar tu sesión de administrador?">
            <button type="submit">Cerrar sesión</button>
          </form>
        </nav>
        {% endif %}
        <a class="encabezado__portal-enlace" href="/">Portal del ciudadano</a>
      </div>
    </div>
  </header>

  <main id="contenido" class="contenedor {% block main_extra_class %}{% endblock %}">
    {% if error %}
    <p class="aviso aviso--error" role="alert">{{ error }}</p>
    {% endif %}
    {% block contenido %}{% endblock %}
  </main>

  {% if mostrar_nav %}
  <dialog id="dialogo-confirmar" class="dialogo">
    <form method="dialog">
      <p id="dialogo-confirmar-texto"></p>
      <div class="acciones">
        <button type="submit" value="cancelar" class="boton boton--neutro" autofocus>Cancelar</button>
        <button type="submit" value="confirmar" class="boton boton--peligro">Confirmar</button>
      </div>
    </form>
  </dialog>
  {% endif %}
</body>
</html>
