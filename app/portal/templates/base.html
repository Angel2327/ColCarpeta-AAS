<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}ColCarpeta{% endblock %} — ColCarpeta</title>

  <link rel="icon" href="{{ estatico('favicon.ico') }}" sizes="32x32">
  <link rel="icon" href="{{ estatico('icono.svg') }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ estatico('icono-180.png') }}">
  <link rel="manifest" href="{{ estatico('site.webmanifest') }}">
  <meta name="theme-color" content="#14425C">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ estatico('estilos.css') }}">
  <script src="{{ estatico('htmx.min.js') }}" defer></script>
  <script src="{{ estatico('confirmar.js') }}" defer></script>
</head>
<body>
  <a class="saltar-al-contenido" href="#contenido">Saltar al contenido</a>

  <header class="encabezado">
    <div class="contenedor encabezado__barra">
      <a class="encabezado__marca" href="{{ '/carpeta' if ciudadano else '/sesion' }}">
        <img src="{{ estatico('icono.svg') }}" alt="" width="28" height="28">
        ColCarpeta
      </a>
      {% if ciudadano %}
      <nav class="encabezado__nav" aria-label="Navegación principal">
        <a href="/carpeta"{% if activa(request, '/carpeta', '/documentos') %} aria-current="page"{% endif %}>Mi carpeta</a>
        <a href="/perfil"{% if activa(request, '/perfil') %} aria-current="page"{% endif %}>Perfil</a>
        <a href="/notificaciones" id="notificaciones-contador" hx-get="/notificaciones/contador" hx-trigger="load, every {{ notificaciones_contador_intervalo_segundos }}s" hx-swap="outerHTML"{% if activa(request, '/notificaciones') %} aria-current="page"{% endif %}>Notificaciones</a>

        <form method="post" action="/salir" class="encabezado__salir" data-confirmar="¿Cerrar tu sesión?">
          <button type="submit">Cerrar sesión</button>
        </form>
      </nav>
      {% endif %}
    </div>
  </header>

  <main id="contenido" class="contenedor {% block main_extra_class %}{% endblock %}">
    {% if mensaje_exito %}
    <p class="aviso aviso--exito" role="status">{{ mensaje_exito }}</p>
    {% endif %}
    {% block contenido %}{% endblock %}
  </main>

  <dialog id="dialogo-confirmar" class="dialogo">
    <form method="dialog">
      <p id="dialogo-confirmar-texto"></p>
      <div class="acciones">
        <button type="submit" value="cancelar" class="boton boton--neutro" autofocus>Cancelar</button>
        <button type="submit" value="confirmar" class="boton boton--peligro">Confirmar</button>
      </div>
    </form>
  </dialog>
</body>
</html>
