# Solo para verificar en Linux el camino de descarga de documentos de otro operador
# (app/interoperabilidad/operadores.py), sospechoso de colgarse en Windows -- ver el
# docstring de ese modulo. NO es para desplegar: Railway usa el Dockerfile solo, sin
# este archivo.
#
# Corre dos contenedores en una red Docker aislada (nada se publica al host salvo el
# puerto de la propia app, igual que en produccion):
#   - app: la aplicacion real, con el .env local montado para usar la base de datos y
#     el bucket reales de Supabase (los mismos que uvicorn --reload usa en Windows).
#   - prueba-transferencia: scripts/probar_transferencia.py corriendo como "operador de
#     origen", en su propio contenedor Linux, para que su servidor de confirmacion
#     tambien quede dentro de la red aislada (nunca expuesto al host ni a la LAN).
#
# Uso: ver las instrucciones que dio Claude al terminar esta tarea, o simplemente:
#   docker compose -f docker-compose.test.yml up --build app -d
#   docker compose -f docker-compose.test.yml run --rm prueba-transferencia
#   docker compose -f docker-compose.test.yml down

services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./.env:/app/.env:ro
    environment:
      - PORT=8000

  prueba-transferencia:
    build: .
    # Se corre con "docker compose up", no "run": un contenedor de "run" no registra el
    # nombre del servicio como alias DNS en la red (solo su propio nombre generado al
    # azar), asi que "app" no podria resolver "prueba-transferencia" para el POST de
    # confirmAPI. Con "up" si queda expuesto por el nombre del servicio.
    depends_on:
      - app
    volumes:
      - ./.env:/app/.env:ro
    entrypoint: ["python", "scripts/probar_transferencia.py"]
    command:
      - --base-url=http://app:8000
      - --confirmacion-bind=0.0.0.0
      - --confirmacion-host=prueba-transferencia

  # --- CU-03 (envio) + CU-16 (recepcion) entre dos instancias propias -----------------
  # Dos operadores independientes ("app-a" envia, "app-b" recibe), cada uno con su
  # propia base de datos Postgres local y desechable -- a diferencia de "app" arriba,
  # estos NO tocan la base de datos real de Supabase ni el MinTIC real: "mock-centralizador"
  # (scripts/mock_centralizador.py) hace de centralizador para ambos, con estado en
  # memoria. Es la forma de probar el ciclo completo sin arriesgar el directorio
  # compartido por 72 equipos ni inventar cedulas contra el servicio real.
  # Ambos SI comparten el bucket S3 real (mismo .env): las claves de objeto son
  # aleatorias, no hay riesgo de choque, y evita levantar un S3 falso solo para esto.
  #
  # Uso:
  #   docker compose -f docker-compose.test.yml up --build -d postgres-a postgres-b mock-centralizador app-a app-b
  #   docker compose -f docker-compose.test.yml run --rm prueba-envio
  #   docker compose -f docker-compose.test.yml run --rm prueba-carpeta-completa   # CU-07/08/10/17 + perfil
  #   docker compose -f docker-compose.test.yml down -v   # -v: tambien borra los datos de postgres-a/b

  postgres-a:
    image: postgres:16-alpine
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=colcarpeta_a

  postgres-b:
    image: postgres:16-alpine
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=colcarpeta_b

  mock-centralizador:
    build: .
    entrypoint: ["uvicorn", "scripts.mock_centralizador:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      # Directorio falso: los dos operadores de esta prueba, resueltos por _id (nunca
      # por operatorName -- CLAUDE.md, trampa 5). Las URLs son http simple porque no
      # hay TLS entre contenedores; ver TRANSFERENCIA_EXIGIR_HTTPS=false mas abajo.
      - >-
        MOCK_DIRECTORIO={"test-operador-a": {"operatorName": "Operador A (prueba)", "transferAPIURL": "http://app-a:8000/api/transferCitizen"},
        "test-operador-b": {"operatorName": "Operador B (prueba)", "transferAPIURL": "http://app-b:8000/api/transferCitizen"}}

  app-a:
    build: .
    depends_on:
      - postgres-a
      - mock-centralizador
    ports:
      - "8001:8000"
    volumes:
      - ./.env:/app/.env:ro
    # El .env montado trae las credenciales reales (JWT, S3); las variables de abajo
    # SOBRESCRIBEN puntualmente lo que debe ser propio de esta instancia -- pydantic-
    # settings da prioridad a las variables de entorno sobre el archivo .env.
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:postgres@postgres-a:5432/colcarpeta_a
      - GOVCARPETA_URL=http://mock-centralizador:8080
      - OPERATOR_ID=test-operador-a
      - OPERATOR_NAME=Operador A (prueba)
      - PUBLIC_BASE_URL=http://app-a:8000
      - TRANSFERENCIA_EXIGIR_HTTPS=false
      # AD-11: la cookie del portal es "Secure" por defecto (nunca se manda por HTTP
      # simple); estos contenedores se hablan por HTTP dentro de la red aislada, sin
      # TLS -- mismo motivo y mismo patron que TRANSFERENCIA_EXIGIR_HTTPS=false arriba.
      # NUNCA se apaga en produccion ni en un .env real.
      - PORTAL_COOKIE_SECURE=false
      - OUTBOX_INTERVALO_SEGUNDOS=3
      - DIRECTORIO_OPERADORES_REFRESCO_SEGUNDOS=5
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  app-b:
    build: .
    depends_on:
      - postgres-b
      - mock-centralizador
    ports:
      - "8002:8000"
    volumes:
      - ./.env:/app/.env:ro
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:postgres@postgres-b:5432/colcarpeta_b
      - GOVCARPETA_URL=http://mock-centralizador:8080
      - OPERATOR_ID=test-operador-b
      - OPERATOR_NAME=Operador B (prueba)
      - PUBLIC_BASE_URL=http://app-b:8000
      - TRANSFERENCIA_EXIGIR_HTTPS=false
      - OUTBOX_INTERVALO_SEGUNDOS=3
      - DIRECTORIO_OPERADORES_REFRESCO_SEGUNDOS=5
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  prueba-envio:
    build: .
    depends_on:
      - app-a
      - app-b
    entrypoint: ["python", "scripts/probar_envio_transferencia.py"]
    command:
      - --base-url-a=http://app-a:8000
      - --database-url-a=postgresql://postgres:postgres@postgres-a:5432/colcarpeta_a
      - --database-url-b=postgresql://postgres:postgres@postgres-b:5432/colcarpeta_b
      - --operador-destino-id=test-operador-b

  # scripts/probar_reconciliacion.py: prueba _reconciliar_transferencias() en aislamiento,
  # sin pasar por app-a como servidor vivo (evita que su propio outbox tambien intente
  # tocar las mismas filas). DATABASE_URL/GOVCARPETA_URL iguales a los de app-a: usa la
  # misma base de datos y el mismo centralizador falso.
  prueba-reconciliacion:
    build: .
    depends_on:
      - postgres-a
      - mock-centralizador
    volumes:
      - ./.env:/app/.env:ro
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres-a:5432/colcarpeta_a
      - GOVCARPETA_URL=http://mock-centralizador:8080
      - OPERATOR_ID=test-operador-a
      - OPERATOR_NAME=Operador A (prueba)
    entrypoint: ["python", "scripts/probar_reconciliacion.py"]

  # scripts/probar_colision_email.py: prueba _recibir_transferencia() en aislamiento
  # para la colision de email_carpeta entre DOS CEDULAS DISTINTAS (no pasa del paso 2,
  # nunca llama a GovCarpeta de verdad, asi que no depende de mock-centralizador).
  prueba-colision-email:
    build: .
    depends_on:
      - postgres-a
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres-a:5432/colcarpeta_a
    entrypoint: ["python", "scripts/probar_colision_email.py"]

  # scripts/probar_primer_acceso.py: consume el token de primer acceso de un ciudadano
  # ya recibido por transferencia en app-b (lo emite _emitir_token_primer_acceso al
  # completarse la recepcion) y confirma que puede iniciar sesion despues. El token en
  # claro nunca esta en la base -- se extrae del log de app-b ("correo simulado", ver
  # app/notificaciones/correo.py) y se pasa por linea de comandos:
  #   docker compose -f docker-compose.test.yml logs app-b | grep -A3 "correo simulado"
  #   docker compose -f docker-compose.test.yml run --rm prueba-primer-acceso \
  #     --base-url=http://app-b:8000 --token=<extraido> --usuario=<cedula>
  prueba-primer-acceso:
    build: .
    depends_on:
      - app-b
    entrypoint: ["python", "scripts/probar_primer_acceso.py"]

  # scripts/probar_reenvio_primer_acceso.py: siembra un ciudadano pendiente de primer
  # acceso con un token YA vencido directo en postgres-b, y prueba el reenvio contra
  # app-b viva. Necesita DATABASE_URL (a diferencia de prueba-primer-acceso, que solo
  # es cliente HTTP) para poder sembrar el estado inicial.
  #   docker compose -f docker-compose.test.yml run --rm prueba-reenvio-primer-acceso
  #   docker compose -f docker-compose.test.yml logs app-b | grep -A3 "correo simulado"
  #   docker compose -f docker-compose.test.yml run --rm prueba-primer-acceso \
  #     --base-url=http://app-b:8000 --token=<el nuevo, extraido arriba> --usuario=900400801
  prueba-reenvio-primer-acceso:
    build: .
    depends_on:
      - app-b
    volumes:
      - ./.env:/app/.env:ro
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres-b:5432/colcarpeta_b
    entrypoint: ["python", "scripts/probar_reenvio_primer_acceso.py"]
    command:
      - --base-url=http://app-b:8000

  # scripts/probar_regreso_antes_de_purga.py: siembra un TRASLADADO previo directo en
  # postgres-a y le envia una transferencia entrante con la misma cedula y el mismo
  # email_carpeta, contra la app-a viva (necesita su bandeja de salida corriendo).
  prueba-regreso:
    build: .
    depends_on:
      - app-a
    volumes:
      - ./.env:/app/.env:ro
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres-a:5432/colcarpeta_a
    entrypoint: ["python", "scripts/probar_regreso_antes_de_purga.py"]
    command:
      - --base-url=http://app-a:8000

  # scripts/probar_carpeta_completa.py: CU-07 (buscar y clasificar), CU-08 (eliminar,
  # borrado diferido), CU-10 (sustituir sin perder historia), CU-17 (notificaciones) y
  # GET/PATCH /api/v1/perfil, contra la app-a viva. Al final prueba tambien
  # _purgar_documentos en aislamiento (retrocede purgar_despues_de en la base, sin
  # esperar PURGE_DELAY_DAYS de verdad) -- necesita el .env real montado porque esa
  # parte borra el objeto del documento purgado del bucket S3 real.
  prueba-carpeta-completa:
    build: .
    depends_on:
      - app-a
    volumes:
      - ./.env:/app/.env:ro
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres-a:5432/colcarpeta_a
    entrypoint: ["python", "scripts/probar_carpeta_completa.py"]
    command:
      - --base-url=http://app-a:8000
      - --database-url=postgresql://postgres:postgres@postgres-a:5432/colcarpeta_a

  # scripts/probar_portal.py: portal del ciudadano (AD-11) de punta a punta por las
  # pantallas HTML -- registro, login, subir, listar, ver detalle y descargar un
  # documento, cerrar sesion -- contra la app-a viva. Necesita el .env real montado
  # porque la carga sube de verdad al bucket S3 real (igual que prueba-carpeta-completa).
  prueba-portal:
    build: .
    depends_on:
      - app-a
    volumes:
      - ./.env:/app/.env:ro
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres-a:5432/colcarpeta_a
    entrypoint: ["python", "scripts/probar_portal.py"]
    command:
      - --base-url=http://app-a:8000
      - --database-url=postgresql://postgres:postgres@postgres-a:5432/colcarpeta_a

  # scripts/probar_firma_digital.py: CU-09 (validacion de firma digital), sobre CU-05 y
  # CU-13. Genera con pyHanko un PDF firmado, uno firmado y luego alterado, y uno sin
  # firma; carga los tres y espera a que la bandeja de salida de app-a los valide
  # (corre en segundo plano, AD-05) antes de verificar firma_valida/firma_firmante/
  # firma_fecha. No necesita el .env real: no toca S3 fuera de lo que ya hace app-a.
  prueba-firma-digital:
    build: .
    depends_on:
      - app-a
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres-a:5432/colcarpeta_a
    entrypoint: ["python", "scripts/probar_firma_digital.py"]
    command:
      - --base-url=http://app-a:8000
      - --database-url=postgresql://postgres:postgres@postgres-a:5432/colcarpeta_a

  # scripts/probar_firma_transferencia.py: CU-09 enganchado en CU-16. Simula un
  # operador de origen que envia dos documentos "certificado: true" -- uno firmado de
  # verdad, otro firmado y luego alterado -- por POST /api/transferCitizen a app-a.
  # Necesita mock-centralizador (para que validateCitizen diga "disponible" y la
  # recepcion llegue hasta ACTIVO) y sirve los dos PDF desde su propio servidor HTTP
  # local, igual patron que "prueba-transferencia" con confirmAPI.
  prueba-firma-transferencia:
    build: .
    depends_on:
      - app-a
      - mock-centralizador
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres-a:5432/colcarpeta_a
    entrypoint: ["python", "scripts/probar_firma_transferencia.py"]
    command:
      - --base-url=http://app-a:8000
      - --database-url=postgresql://postgres:postgres@postgres-a:5432/colcarpeta_a
      - --puerto-servidor=9401
      - --servidor-bind=0.0.0.0
      - --servidor-host=prueba-firma-transferencia
