# PLANTILLA, no un Secret real -- segura de versionar porque ningun valor de abajo es
# una credencial de verdad. NO se aplica con "kubectl apply -f" tal cual.
#
# El Secret real ("colcarpeta-secret") se genera desde el .env local, que ya tiene las
# credenciales reales, con:
#
#   kubectl create secret generic colcarpeta-secret --from-env-file=<archivo-intermedio>
#
# OJO, importante (ver k8s/README.md para el detalle completo): "--from-env-file" NO
# quita comillas ni interpreta "\n" como salto de linea -- lee el archivo literal. Si
# en el .env real algun valor esta entre comillas (las llaves JWT_LLAVE_PRIVADA/
# JWT_LLAVE_PUBLICA lo estan), pasarle el .env directamente deja las comillas como
# parte del valor y la aplicacion falla de forma confusa al intentar parsear el PEM.
# Por eso NO se usa el .env real directamente: se genera antes un archivo intermedio,
# solo con estas seis claves, con las comillas ya quitadas -- y ese archivo intermedio
# tampoco se versiona (vive fuera del repositorio, se borra despues de usarlo).
#
# Claves que tiene que tener el Secret real (deben coincidir exactamente con estos
# nombres: son los que lee app/config.py via envFrom.secretRef en deployment.yaml):
apiVersion: v1
kind: Secret
metadata:
  name: colcarpeta-secret
type: Opaque
stringData:
  DATABASE_URL: "postgresql://usuario:CONTRASENA@host-de-supabase:5432/postgres"
  S3_ACCESS_KEY: "RELLENO"
  S3_SECRET_KEY: "RELLENO"
  # PEM sin las comillas que SI lleva en el .env local -- con saltos de linea reales
  # o con "\n" literal, cualquiera de las dos formas sirve (app/config.py las acepta
  # ambas, ver el validador _normalizar_pem).
  JWT_LLAVE_PRIVADA: "-----BEGIN PRIVATE KEY-----\nRELLENO\n-----END PRIVATE KEY-----\n"
  JWT_LLAVE_PUBLICA: "-----BEGIN PUBLIC KEY-----\nRELLENO\n-----END PUBLIC KEY-----\n"
  # Hash de Argon2id (app.identidad.seguridad.hash_password), nunca la clave en claro.
  # Vacio = consola de administracion inutilizable, que es un valor valido.
  ADMIN_PASSWORD_HASH: "RELLENO"
